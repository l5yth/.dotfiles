#
# Pin DisplayPort-1 to the left of HDMI-A-0 on intan. amdgpu re-enumerates the
# outputs when the monitors wake from DPMS power-save and can swap the two
# left<->right; nothing in this repo pins them (the shared config's
# `autorandr --change` has nothing to apply unless a profile was saved locally
# — none is tracked here), so without this line the layout is whatever the
# driver happened to hand back.
#
# Host-scoped rather than shared because DisplayPort-1 and HDMI-A-0 name which
# cable is in which port on this one machine. Another amdgpu box with the same
# two connector names has different physical monitors behind them, so "both
# outputs exist" is not a real guard — it would produce a confidently wrong
# layout instead of doing nothing. Same call as hosts/saiph/'s forced panel
# mode, one step stronger.
#
# `exec_always`, not `exec`, so it re-applies whenever i3 re-reads its config
# (reload or restart), not only at login. Nothing else re-runs it: a DPMS wake
# does not, which is what the hotkey below is for.
#
# It is launched after `autorandr --change` because this file is reached only
# through the trailing `config.d/*.conf` include at the end of the shared
# config. No autorandr profile is tracked in this repo, so on a machine that
# has not saved one locally there is nothing to race. Where one has been saved
# this does NOT decide the contest: i3 launches `exec_always` children
# asynchronously, so config position fixes launch order, not completion order,
# and autorandr's own xrandr call could land after this one. Settle it there
# rather than assuming this file wins.
#
# The command is set once and used twice: the startup path and the hotkey
# below must not drift apart.
set $fix_displays xrandr --output DisplayPort-1 --auto --left-of HDMI-A-0

exec_always --no-startup-id $fix_displays

# Manual re-apply for the case this file exists for: a DPMS wake that flips the
# outputs mid-session, where waiting for an i3 reload is not what you want.
# Sits next to $mod+Shift+a (audio-fix) as the second panic key. Host-scoped
# for the same reason that one is — a bindsym is global whether or not the
# hardware behind it exists. $mod is already bound here: this file is included
# from the end of .config/i3/config, after `set $mod`.
bindsym $mod+Shift+d exec --no-startup-id $fix_displays
