#
# intan layout: HDMI-A-0 primary, DisplayPort-1 rotated left on its right.
# Host-scoped: the connector names depend on which cable is in which port.
# --primary carries over what the removed autorandr profile set; without it no
# output is primary.
set $fix_displays xrandr --output HDMI-A-0 --auto --primary --output DisplayPort-1 --auto --right-of HDMI-A-0 --rotate left

# The only thing in this repo that sets the layout, so nothing races it.
# Runs at i3 start and reload only. A DPMS wake can swap the outputs without
# re-running it: $mod+Shift+d re-applies.
exec_always --no-startup-id $fix_displays
bindsym $mod+Shift+d exec --no-startup-id $fix_displays
