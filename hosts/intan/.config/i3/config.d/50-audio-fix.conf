#
# Panic button for the Audioengine 2+ going silent mid-call (intan only — these
# are the only speakers of their kind on any machine here).
#
# The DAC can wedge its ALSA node in an unrecoverable XRUN that no mixer
# reveals: every volume control still reads healthy while nothing reaches the
# speakers. The only cure is forcing PipeWire to re-open the device, which
# `.bin/audio-fix` does in about a second — the entire point of having it on a
# key rather than in a terminal, since it is needed precisely when there is no
# time to open one. `.config/wireplumber/wireplumber.conf.d/99-audioengine-suspend.conf`
# is what stops it happening in the first place; this is the fallback.
#
# Host-scoped rather than shared because a keybinding is global whether or not
# the hardware is present: on any other machine this would burn $mod+Shift+a and
# pop a "not found" notification. The wireplumber rules and the script itself
# are device-guarded at runtime and stay in the common tree.
#
# $mod is already bound here: this file is included from the end of
# .config/i3/config, after `set $mod`.
bindsym $mod+Shift+a exec --no-startup-id audio-fix
