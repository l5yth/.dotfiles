#
# Force the built-in panel to 1680x1050@60 on saiph. The panel's native mode
# is higher; this is a deliberate downscale for readability, performance, and
# consistent scaling, not a workaround for a wrong auto-detected mode.
#
# Host-scoped rather than shared because the correct mode is this one panel's
# property: an "eDP-1 exists" guard would be true on any other laptop too, and
# would wrongly force the same resolution onto a different native panel.
#
# `exec_always`, not `exec`, so this re-applies on every i3 reload and survives
# hotplug/DPMS wake the same way autorandr and adjust-font.sh do. It comes
# after both in the merged config because this file is only reached through
# the trailing `config.d/*.conf` include at the end of the shared config, so
# it always runs after `autorandr --change` above and wins. No autorandr
# profile is tracked anywhere in this repo today, so that is currently moot —
# it stops being moot the moment one is ever saved for this machine.
exec_always --no-startup-id xrandr --output eDP-1 --mode 1680x1050 --rate 60
