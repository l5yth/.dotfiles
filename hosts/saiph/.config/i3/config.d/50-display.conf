#
# Deliberate downscale of saiph's built-in panel (native mode is higher).
# Host-scoped: an "eDP-1 exists" guard would force this mode onto any laptop.
# Runs at i3 start and reload only: if a DPMS wake loses the mode, reload i3.
exec_always --no-startup-id xrandr --output eDP-1 --mode 1680x1050 --rate 60
