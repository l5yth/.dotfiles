# Friendly name for the Audioengine 2+ desktop speakers.
#
# These speakers are a USB DAC built on a Cambridge Silicon Radio chip (USB id 0a12:1243,
# "CSRA64210") whose USB product descriptor Audioengine never customized. As a result every
# audio tool on this machine (wpctl, pavucontrol, MATE sound applet, lsusb) labels the
# ONLY USB audio output as "CSRA64210 [TaoTronics Headset BH-22 in charging mode]". There is
# no TaoTronics headset, no Bluetooth device, and nothing is charging — it is a baked-in
# factory string. Override the description back to the real product name so the device stops
# being mistaken for a phantom headset in volume menus.
#
# Takes effect on the next wireplumber start (login/reboot) or `systemctl --user restart
# wireplumber`. Matched on the Audioengine card/sink name (regex), not the volatile profile
# suffix, so it survives profile/serial changes.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Audioengine_Ltd.*" }
    ]
    actions = {
      update-props = {
        device.description = "Audioengine 2+"
        device.nick        = "Audioengine 2+"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Audioengine_Ltd.*" }
    ]
    actions = {
      update-props = {
        node.description = "Audioengine 2+"
        node.nick        = "Audioengine 2+"
      }
    }
  }
]
