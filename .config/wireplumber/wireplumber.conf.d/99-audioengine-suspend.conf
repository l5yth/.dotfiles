#
# Keep the Audioengine 2+ ALSA node permanently open — never suspend it on idle.
#
# The speakers are a full-speed (12M) USB DAC on a Cambridge Silicon Radio chip
# (0a12:1243) that reliably fails to start its isochronous stream when PipeWire
# re-opens the device after an idle suspend. The failure is silent to every
# high-level tool: wpctl/pactl keep reporting the sink as the healthy default,
# unmuted, at a sane volume, while /proc/asound/A2/pcm0p/sub0/status shows
# `state: XRUN` with hw_ptr and appl_ptr frozen one period in (768 frames) and
# /proc/asound/A2/stream0 shows `Status: Stop`. No samples reach the DAC and
# pipewire logs `snd_pcm_avail after recover: Broken pipe` every ~2s forever —
# it never recovers on its own.
#
# Observed twice on 2026-08-18, both times at a device *open* after idle, not
# mid-stream: once at 14:21:08 when a desktop notification sound woke the
# suspended node (the notification service start is the only other log line at
# that second), and again at 15:28:16 on the first open after a test tone let
# the node go idle. WirePlumber's default suspend-node hook closes the PCM five
# seconds after the last stream goes away, so ordinary desktop use — a pause
# between calls, a gap between videos — walks into that broken re-open path
# several times an hour.
#
# `session.suspend-timeout-seconds = 0` disables the timeout for this node only,
# so the PCM stays open from login onward and the fragile open path is never
# taken. `node.pause-on-idle = false` stops the node being paused short of a
# full suspend, which puts the stream through the same start sequence.
#
# Cost: the DAC holds its USB isochronous bandwidth reservation and stays
# powered continuously instead of idling. That is the intended trade — a few
# hundred mW against an unrecoverable dropout mid-call.
#
# Matched on the node-name regex, not the serial-bearing profile suffix, so it
# survives a serial or profile change — same reasoning as the sibling rename
# rule in 99-audioengine-rename.conf. Takes effect on the next wireplumber
# start: `systemctl --user restart wireplumber`.
#
# If XRUNs still appear after this, the next thing to try is buffer headroom
# (`api.alsa.headroom = 1024` on the same node) — the DAC also shares an xHCI
# root hub with the Razer Kiyo Pro Ultra, and the camera renegotiating its mic
# rate is the remaining suspect for any mid-stream (rather than at-open) break.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Audioengine_Ltd.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle               = false
      }
    }
  }
]
